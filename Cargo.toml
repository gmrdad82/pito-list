[package]
name = "pito-list"
version = "0.8.0"
authors = ["Gamer Dad"]
edition = "2024"
description = "Selectable list rows for ratatui apps: a bold marker on the selected row in its own style, a selected range, padded columns that drop by priority or fit their cells, a flexible clipped column, section headings, a styled header, lazy rows, shared vectors built on demand, rows rewritten and restyled in place, the drawn column positions, a scrollbar and a count of the rows on screen in the app's words, scrolling, paging and click hits"
license = "MIT"
repository = "https://github.com/gmrdad82/pito-list"
homepage = "https://pitomd.com"
publish = false

[lib]
name = "pito_list"

[features]
crossterm = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"], optional = true }
ratatui = { version = "0.30", default-features = false }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
pito-footer = { git = "https://github.com/gmrdad82/pito-footer", tag = "v0.4.0", features = ["crossterm"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[[example]]
name = "demo"
required-features = ["crossterm"]
